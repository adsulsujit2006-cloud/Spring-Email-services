<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { margin:0; padding:0; background:#0f172a; font-family:Arial, Helvetica, sans-serif; }
        .wrap { max-width:600px; margin:30px auto; border-radius:18px; overflow:hidden;
            background:#ffffff; box-shadow:0 10px 30px rgba(0,0,0,.35);
            animation: slideUp 1s ease-out both; }
        .hero { padding:50px 20px; text-align:center; color:#fff;
            background:linear-gradient(135deg,#6366f1,#ec4899,#f59e0b,#6366f1);
            background-size:300% 300%; animation: gradientMove 6s ease infinite; }
        .emoji { font-size:64px; display:inline-block; animation: bounce 1.6s infinite; }
        h1 { margin:15px 0 5px; font-size:34px; animation: fadeIn 1.5s ease both; }
        .name { display:inline-block; animation: pulse 2s infinite; }
        .hero p { margin:0; font-size:16px; opacity:.95; animation: fadeIn 2.2s ease both; }
        .body { padding:30px; color:#334155; text-align:center; line-height:1.6; }
        .btn { display:inline-block; margin-top:20px; padding:14px 34px; border-radius:50px;
            background:#6366f1; color:#fff !important; text-decoration:none; font-weight:bold;
            animation: glow 2s infinite; }
        .confetti { height:10px; background:repeating-linear-gradient(90deg,#6366f1 0 20px,#ec4899 20px 40px,#f59e0b 40px 60px,#10b981 60px 80px);
            background-size:160px 10px; animation: slideBar 2s linear infinite; }
        .footer { padding:18px; text-align:center; font-size:12px; color:#94a3b8; background:#f8fafc; }

        @keyframes slideUp { from {opacity:0; transform:translateY(40px);} to {opacity:1; transform:translateY(0);} }
        @keyframes fadeIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
        @keyframes bounce { 0%,100% {transform:translateY(0);} 50% {transform:translateY(-18px);} }
        @keyframes pulse { 0%,100% {transform:scale(1);} 50% {transform:scale(1.08);} }
        @keyframes gradientMove { 0% {background-position:0% 50%;} 50% {background-position:100% 50%;} 100% {background-position:0% 50%;} }
        @keyframes glow { 0%,100% {box-shadow:0 0 0 0 rgba(99,102,241,.6);} 50% {box-shadow:0 0 0 14px rgba(99,102,241,0);} }
        @keyframes slideBar { from {background-position:0 0;} to {background-position:160px 0;} }
    </style>
</head>
<body>
<div class="wrap">
    <div class="confetti"></div>
    <div class="hero">
        <div class="emoji">🎉</div>
        <h1>Welcome, <span class="name">{{name}}</span>!</h1>
        <p>We're so happy to have you on board 🚀</p>
    </div>
    <div class="body">
        <h2>Hello {{name}} 👋</h2>
        <p>Your account is ready. Explore, learn and build something amazing with us.<br>
            If you ever need help, just reply to this email.</p>
        <a class="btn" href="Hello.html">Get Started</a>
    </div>
    <div class="confetti"></div>
    <div class="footer">© 2026 Your Company • You received this because you signed up.</div>
</div>
</body>
</html>
